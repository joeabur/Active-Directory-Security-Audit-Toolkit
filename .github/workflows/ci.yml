name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7 on Linux
            os: ubuntu-latest
            shell: pwsh
          - name: PowerShell 7 on Windows
            os: windows-latest
            shell: pwsh
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned development dependencies
        run: ./scripts/Install-DevDependencies.ps1

      - name: PSScriptAnalyzer
        run: ./scripts/Invoke-Lint.ps1

      - name: Pester (unit and offline integration; Windows-domain suite skips itself)
        run: ./scripts/Invoke-Tests.ps1 -Suite All -CI

      - name: Validate documentation, examples and schemas
        run: ./scripts/Test-Documentation.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shell }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
